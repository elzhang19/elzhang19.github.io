project:
  type: website
  output-dir: docs

# Meta
description-meta: "Elena Zhang portfolio website"
author-meta: "Elena Zhang"

website:
  title: "Elena Zhang"
  image: "https://quarto.org/quarto.png"
  description: "Elena Zhang"
 
  navbar:
    background: dark  # You can change the background color here

    left:   # You can comment out all navigation items here if you just like to keep the index page only
#      - text: Home
#        href: index.qmd
      - text: About
        menu:
          - text: News
            href: posts.qmd#category=news
          - text: Events
            href: posts.qmd#category=event      
          - text: Contact
            href: contact.qmd             
      - text: Research
        menu:
          - text: List of Publications
            href: publications.qmd
          - text: Selected Papers
            href: posts.qmd#category=paper
          - text: Grants
            href: projects.qmd                                
      - text: Teaching # Comment the Teaching part out to remove the Teaching page
        href: teaching.qmd
      - text: Outreach
        menu:        
        - text: Presentations
          href: posts.qmd#category=presentation                   
      - text: Group   # Comment the Group part out to remove the Group page
        href: people.qmd

    right: 
      - text: Resume
        href: files/Zhang_Elena_General.pdf
      - icon: github
        href: https://elzhang19.github.io/
        target: _blank
  
  page-navigation: true
  
  page-footer: 
    left: "Elena Zhang(https://github.com/elzhang19) &copy; <script>document.write(new Date().getFullYear())</script>" 
    center: "Made with [Quarto](https://quarto.org/)"
    right:  
      - icon: github
        href: https://elzhang19.github.io/
        target: _blank
  
  search:
    location: navbar
    type: textbox
  
  reader-mode: true

  draft-mode: unlinked
  
  repo-url: https://github.com/elzhang19/elzhang19.github.io
#  repo-actions: [edit, issue, source]
  
  open-graph: true
  
  twitter-card: true 
#  card-style: summary      
  
  site-url: "https://elzhang19.github.io/"

bibliography: references.bib  # Add references.bib to the root folder to enable the bibliography function

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    footnotes-hover: true
    code-copy: true
    code-link: true
    code-overflow: wrap
    fig-align: center
    link-external-icon: false
    link-external-newwindow: true
    email-obfuscation: javascript
    link-external-filter: '^(?:http:|https:)\/\/drganghe\.github\.io\/custom'
    include-in-header: "files/includes/_academic.qmd"

